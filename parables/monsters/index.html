<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resonant Parables — Painting Shadows</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --parchment: #ede8d5;
      --ink: #1e1a15;
      --ink-soft: #3d3228;
      --gold: #b8933e;
      --gold-light: #d4ac5a;
      --accent: #7a5c35;
      --shadow-warm: rgba(42,30,15,0.18);
      --shadow-deep: rgba(20,12,4,0.55);
      --spine-color: #c8a96a;
      --page-bg: #faf7ee;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Crimson Pro", serif;
      background: var(--parchment);
      color: var(--ink-soft);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Parchment atmosphere */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 20% 15%, rgba(201,169,97,0.09) 0%, transparent 60%),
        radial-gradient(ellipse 50% 70% at 80% 85%, rgba(139,111,71,0.06) 0%, transparent 55%),
        radial-gradient(ellipse 90% 40% at 50% 50%, rgba(255,250,235,0.35) 0%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grain texture */
    body::after {
      content: "";
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    /* ── WRAP ── */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1060px;
      padding: 44px 24px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeDown 0.9s ease-out both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    header {
      position: relative;
      padding: 24px 60px 20px;
    }

    /* Corner bracket marks */
    header::before, header::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      border-color: rgba(184,147,62,0.35);
      border-style: solid;
    }
    header::before { top: 8px; left: 50%; transform: translateX(-200px); border-width: 1px 0 0 1px; }
    header::after  { bottom: 8px; left: 50%; transform: translateX(178px); border-width: 0 1px 1px 0; }

    .series {
      font-family: "Cinzel", serif;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      font-size: 0.57rem;
      color: var(--gold);
      opacity: 0.6;
      margin-bottom: 20px;
    }

    /* Thin vertical rule dropping into title */
    .title-drop {
      width: 1px;
      height: 28px;
      background: linear-gradient(to bottom, transparent, rgba(184,147,62,0.5));
      margin: 0 auto 14px;
    }

    h1 {
      font-family: "Cinzel", serif;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--ink);
      font-size: clamp(1.5rem, 3.2vw, 2.5rem);
      line-height: 1.25;
    }

    /* "The" floated above as a small gold word */
    h1 .article {
      display: block;
      font-size: 0.38em;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.65;
      margin-bottom: 2px;
    }

    h1 .title-main { display: block; }

    /* Italic Crimson descriptor beneath */
    h1 .title-sub {
      display: block;
      font-family: "Crimson Pro", serif;
      font-style: italic;
      font-size: 0.46em;
      letter-spacing: 0.04em;
      color: var(--accent);
      opacity: 0.7;
      margin-top: 8px;
    }

    .header-rule {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 220px;
      margin: 18px auto 14px;
    }
    .header-rule::before, .header-rule::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.3;
    }
    .header-rule-sym { color: var(--gold); font-size: 0.5em; opacity: 0.55; letter-spacing: 0.3em; }

    .sub {
      font-family: "Cinzel", serif;
      font-size: 0.56rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.4;
    }

    /* ── STAGE ── */
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      user-select: none;
      animation: fadeUp 0.9s ease-out 0.15s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── NAV BUTTONS ── */
    .nav-btn {
      appearance: none;
      border: 1px solid rgba(184,147,62,0.3);
      background: rgba(250,247,238,0.9);
      backdrop-filter: blur(8px);
      color: var(--accent);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 18px var(--shadow-warm);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(184,147,62,0.6);
      background: rgba(255,255,255,0.95);
      box-shadow: 0 8px 28px var(--shadow-warm);
    }
    .nav-btn:active { transform: translateY(0); }
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── BOOK ── */
    .book-wrap {
      position: relative;
      /* Outer glow / desk shadow */
      filter:
        drop-shadow(0 30px 60px rgba(20,12,4,0.45))
        drop-shadow(0 8px 20px rgba(20,12,4,0.25));
    }

    .book {
      position: relative;
      width: min(840px, 90vw);
      aspect-ratio: 2 / 1.35;
      perspective: 2000px;
      /* Ensure height resolves for children */
      display: block;
    }

    /* The static spread — two page slots side by side */
    .spread {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
    }

    /* Left slot: absolute, left half */
    #leftSlot {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 50% !important;
      height: 100% !important;
      overflow: hidden;
    }

    /* Right slot: absolute, right half */
    #rightSlot {
      position: absolute !important;
      top: 0 !important;
      left: 50% !important;
      width: 50% !important;
      height: 100% !important;
      overflow: hidden;
    }

    .page-slot {
      overflow: hidden;
    }

    /* Image fills slot corner to corner */
    img.page {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: fill !important;
      display: block;
      pointer-events: none;
    }

    /* Left page — very slight right-edge inner shadow (near spine) */
    #leftSlot::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,
        transparent 85%,
        rgba(30,15,5,0.18) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* Right page — slight left-edge inner shadow */
    #rightSlot::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to left,
        transparent 85%,
        rgba(30,15,5,0.18) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* ── SPINE seam down the center ── */
    .spine {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(to right,
        rgba(20,10,2,0.28) 0%,
        rgba(184,147,62,0.25) 40%,
        rgba(184,147,62,0.25) 60%,
        rgba(20,10,2,0.28) 100%
      );
    }
    /* Top & bottom spine caps */
    .spine::before, .spine::after {
      content: '';
      position: absolute;
      left: -2px; right: -2px;
      height: 3px;
      background: rgba(30,15,5,0.2);
      border-radius: 1px;
    }
    .spine::before { top: 0; }
    .spine::after  { bottom: 0; }

    /* Page edge/curl — faint left shadow on whole book */
    .book::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        /* Left edge stack shadow */
        linear-gradient(to right, rgba(30,15,5,0.12) 0%, transparent 4%),
        /* Right edge stack shadow */
        linear-gradient(to left, rgba(30,15,5,0.08) 0%, transparent 4%),
        /* Top slight darkening */
        linear-gradient(to bottom, rgba(30,15,5,0.06) 0%, transparent 8%),
        /* Bottom slight darkening */
        linear-gradient(to top, rgba(30,15,5,0.1) 0%, transparent 10%);
    }

    /* ── FLIP OVERLAYS ── */
    .flip {
      position: absolute;
      top: 0; bottom: 0;
      width: 50%;
      z-index: 20;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      display: none;
    }

    .flip.right {
      left: 50%;
      transform-origin: left center;
    }
    .flip.left {
      left: 0;
      transform-origin: right center;
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      overflow: hidden;
    }
    .flip-face img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: none;
    }
    .flip-face.back { transform: rotateY(180deg); }

    /* Shadow that sweeps across during flip */
    .flip-face.front::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to left, rgba(20,10,2,0.0) 0%, rgba(20,10,2,0.22) 100%);
      z-index: 3;
      pointer-events: none;
    }

    @keyframes flipForward {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(-180deg); }
    }
    @keyframes flipBackward {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(180deg); }
    }

    .flip.forward  { animation: flipForward  680ms cubic-bezier(0.18,0.72,0.14,1) forwards; }
    .flip.backward { animation: flipBackward 680ms cubic-bezier(0.18,0.72,0.14,1) forwards; }

    /* ── META / FOOTER ── */
    .meta {
      margin-top: 20px;
      text-align: center;
      font-family: "Cinzel", serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.62rem;
      opacity: 0.5;
      color: var(--accent);
      animation: fadeUp 0.9s ease-out 0.3s both;
    }

    /* Dot indicators */
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
      animation: fadeUp 0.9s ease-out 0.35s both;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.2;
      transition: opacity 0.3s ease, transform 0.3s ease;
      cursor: pointer;
    }
    .dot.active {
      opacity: 0.75;
      transform: scale(1.35);
    }
    .dot:hover { opacity: 0.5; }

    /* Keyboard hint */
    .kbd-hint {
      margin-top: 10px;
      text-align: center;
      font-family: "Cinzel", serif;
      font-size: 0.55rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.3;
      color: var(--accent);
    }

    /* Back button */
    .back-btn {
      position: fixed;
      top: 20px; left: 20px;
      z-index: 100;
      background: rgba(250,247,238,0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(184,147,62,0.3);
      padding: 8px 16px;
      color: var(--accent);
      font-family: "Cinzel", serif;
      font-size: 0.62em;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 2px 14px var(--shadow-warm);
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.98);
      border-color: var(--gold);
      color: var(--ink);
    }

    @media (max-width: 640px) {
      .book { aspect-ratio: 2 / 1.6; }
      .stage { gap: 10px; }
      .nav-btn { width: 38px; height: 38px; font-size: 17px; }
      .wrap { padding: 32px 12px 40px; }
    }
  </style>
</head>

<body>

  <a class="back-btn" href="/books/parable.html">← Library</a>

  <div class="wrap">
    <header>
      <div class="series">ΔHV Archive &nbsp;·&nbsp; Resonant Parables</div>
      <div class="title-drop"></div>
      <h1>
        <span class="article">The</span>
        <span class="title-main">The Boy Who Painted Shadows</span>
        <span class="title-sub">A book about the feelings we hide &amp; the shadows that keep them safe.</span>
      </h1>
      <div class="header-rule"><span class="header-rule-sym">✦ ✦ ✦</span></div>
      <div class="sub"> Painting Shadows &nbsp;·&nbsp; 15 Pages</div>
    </header>

    <!-- Audio Player -->
    <div style="margin: 16px auto 0; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <audio id="skyAudio" src="/books/parables/monsters/monsters.mp3" preload="none"></audio>
      <button id="audioBtn" aria-label="Play narration" onclick="
        var a = document.getElementById('skyAudio');
        var btn = document.getElementById('audioBtn');
        if (a.paused) { a.volume = document.getElementById('volSlider').value; a.play(); btn.innerHTML = '&#9646;&#9646;&nbsp; Narration'; }
        else { a.pause(); btn.innerHTML = '&#9654;&nbsp; Narration'; }
        a.onended = function(){ btn.innerHTML = '&#9654;&nbsp; Narration'; };
      " style="
        background: transparent;
        color: var(--gold);
        border: 1px solid var(--gold);
        border-radius: 20px;
        padding: 5px 16px;
        font-family: 'Cinzel', serif;
        font-size: 11px;
        letter-spacing: 1.5px;
        cursor: pointer;
        opacity: 0.85;
        transition: opacity 0.2s;
      " onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.85">&#9654;&nbsp; Narration</button>
      <input id="volSlider" type="range" min="0" max="1" step="0.05" value="0.15"
        aria-label="Volume"
        oninput="document.getElementById('skyAudio').volume = this.value"
        style="
          -webkit-appearance: none;
          appearance: none;
          width: 72px;
          height: 3px;
          background: linear-gradient(to right, var(--gold) 0%, var(--gold) 100%);
          border-radius: 2px;
          outline: none;
          opacity: 0.7;
          cursor: pointer;
          transition: opacity 0.2s;
        "
        onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7"
      />
    </div>
    <style>
      #volSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--gold);
        cursor: pointer;
      }
      #volSlider::-moz-range-thumb {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--gold);
        border: none;
        cursor: pointer;
      }
    </style>

    <div class="stage">
      <button class="nav-btn" id="prevBtn" aria-label="Previous spread">‹</button>

      <div class="book-wrap">
        <div class="book" aria-label="Parable book viewer">

          <!-- Static spread -->
          <div class="spread">
            <div class="page-slot" id="leftSlot">
              <img class="page" id="leftImg" alt="Left page">
            </div>
            <div class="page-slot" id="rightSlot">
              <img class="page" id="rightImg" alt="Right page">
            </div>
          </div>

          <!-- Spine seam -->
          <div class="spine"></div>

          <!-- Flip overlay — forward (right page turns) -->
          <div class="flip right" id="flipRight">
            <div class="flip-face front">
              <img id="flipRightFront" alt="">
            </div>
            <div class="flip-face back">
              <img id="flipRightBack" alt="">
            </div>
          </div>

          <!-- Flip overlay — backward (left page turns) -->
          <div class="flip left" id="flipLeft">
            <div class="flip-face front">
              <img id="flipLeftFront" alt="">
            </div>
            <div class="flip-face back">
              <img id="flipLeftBack" alt="">
            </div>
          </div>

        </div>
      </div>

      <button class="nav-btn" id="nextBtn" aria-label="Next spread">›</button>
    </div>

    <div class="meta" id="metaText"></div>
    <div class="dots" id="dots"></div>
    <div class="kbd-hint">← → Arrow keys to turn pages</div>
  </div>

  <script>
    // ── CONFIG ──
    const TOTAL_PAGES   = 15;
    const BASE_PATH     = "/books/parables/monsters/";
    const FILE_PREFIX   = "monsters_p";
    const FILE_EXT      = ".png";
    const TOTAL_SPREADS = Math.floor(TOTAL_PAGES / 2);
    const FLIP_MS       = 680;

    let spread    = 0;
    let animating = false;

    // ── ELEMENTS ──
    const leftImg  = document.getElementById("leftImg");
    const rightImg = document.getElementById("rightImg");
    const prevBtn  = document.getElementById("prevBtn");
    const nextBtn  = document.getElementById("nextBtn");
    const metaText = document.getElementById("metaText");
    const dotsEl   = document.getElementById("dots");

    const flipRight      = document.getElementById("flipRight");
    const flipRightFront = document.getElementById("flipRightFront");
    const flipRightBack  = document.getElementById("flipRightBack");
    const flipLeft       = document.getElementById("flipLeft");
    const flipLeftFront  = document.getElementById("flipLeftFront");
    const flipLeftBack   = document.getElementById("flipLeftBack");

    // ── BUILD DOTS ──
    const dotEls = [];
    for (let i = 0; i < TOTAL_SPREADS; i++) {
      const d = document.createElement("div");
      d.className = "dot";
      d.setAttribute("aria-label", `Spread ${i + 1}`);
      d.addEventListener("click", () => jumpTo(i));
      dotsEl.appendChild(d);
      dotEls.push(d);
    }

    function pageSrc(n) {
      return `${BASE_PATH}${FILE_PREFIX}${n}${FILE_EXT}`;
    }

    function currentPages() {
      const lp = spread * 2 + 1;
      return { leftPage: lp, rightPage: lp + 1 };
    }

    function updateUI() {
      const { leftPage, rightPage } = currentPages();
      leftImg.src  = pageSrc(leftPage);
      rightImg.src = pageSrc(rightPage);

      metaText.textContent = `Spread ${spread + 1} of ${TOTAL_SPREADS}  ·  Pages ${leftPage}–${rightPage}`;

      prevBtn.disabled = spread === 0 || animating;
      nextBtn.disabled = spread === TOTAL_SPREADS - 1 || animating;

      dotEls.forEach((d, i) => d.classList.toggle("active", i === spread));
    }

    function preload(targetSpread) {
      if (targetSpread < 0 || targetSpread >= TOTAL_SPREADS) return;
      const lp = targetSpread * 2 + 1;
      [lp, lp + 1].forEach(p => { const img = new Image(); img.src = pageSrc(p); });
    }

    function showFlip(el) {
      el.style.display = "block";
      el.classList.remove("forward", "backward");
      void el.offsetWidth; // reflow
    }
    function hideFlip(el) {
      el.style.display = "none";
      el.classList.remove("forward", "backward");
    }

    function lockButtons() {
      prevBtn.disabled = true;
      nextBtn.disabled = true;
    }

    // ── FORWARD FLIP ──
    function nextSpread() {
      if (animating || spread >= TOTAL_SPREADS - 1) return;
      animating = true;
      lockButtons();

      const { leftPage, rightPage } = currentPages();
      const nextLeft  = leftPage + 2;
      const nextRight = rightPage + 2;

      flipRightFront.src = pageSrc(rightPage);
      flipRightBack.src  = pageSrc(nextLeft);

      showFlip(flipRight);
      flipRight.classList.add("forward");
      preload(spread + 2);

      setTimeout(() => {
        spread++;
        leftImg.src  = pageSrc(nextLeft);
        rightImg.src = pageSrc(nextRight);
        hideFlip(flipRight);
        animating = false;
        updateUI();
        preload(spread + 1);
        preload(spread - 1);
      }, FLIP_MS);
    }

    // ── BACKWARD FLIP ──
    function prevSpread() {
      if (animating || spread <= 0) return;
      animating = true;
      lockButtons();

      const { leftPage, rightPage } = currentPages();
      const prevLeft  = leftPage - 2;
      const prevRight = rightPage - 2;

      flipLeftFront.src = pageSrc(leftPage);
      flipLeftBack.src  = pageSrc(prevRight);

      showFlip(flipLeft);
      flipLeft.classList.add("backward");
      preload(spread - 2);

      setTimeout(() => {
        spread--;
        leftImg.src  = pageSrc(prevLeft);
        rightImg.src = pageSrc(prevRight);
        hideFlip(flipLeft);
        animating = false;
        updateUI();
        preload(spread + 1);
        preload(spread - 1);
      }, FLIP_MS);
    }

    // ── DOT JUMP (no animation, instant) ──
    function jumpTo(target) {
      if (animating || target === spread) return;
      spread = Math.max(0, Math.min(TOTAL_SPREADS - 1, target));
      updateUI();
      preload(spread + 1);
      preload(spread - 1);
    }

    // ── SWIPE SUPPORT ──
    let touchStartX = 0;
    document.addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) dx < 0 ? nextSpread() : prevSpread();
    }, { passive: true });

    // ── KEYBOARD ──
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") nextSpread();
      if (e.key === "ArrowLeft")  prevSpread();
    });

    // ── WIRE BUTTONS ──
    nextBtn.addEventListener("click", nextSpread);
    prevBtn.addEventListener("click", prevSpread);

    // ── INIT ──
    updateUI();
    preload(1);
  </script>
</body>
</html>
